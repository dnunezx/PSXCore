
name: Build PSXCore Full Package

on:
  workflow_dispatch:
  push:
    branches:
      - tester

jobs:
  build:
    name: Build Tester and Runtime
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout PSXCore
        uses: actions/checkout@v4

      # Use sh here because bash is not installed yet.
      - name: Install build dependencies
        shell: sh
        run: |
          apk add --no-cache \
            build-base \
            bash \
            git \
            cmake \
            binutils \
            coreutils \
            findutils \
            grep \
            sed \
            patch \
            python3 \
            zlib-dev

      - name: Configure PS2 toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "PS2DEV=/usr/local/ps2dev" >> "$GITHUB_ENV"
          echo "PS2SDK=/usr/local/ps2dev/ps2sdk" >> "$GITHUB_ENV"

          for directory in \
            /usr/local/ps2dev/bin \
            /usr/local/ps2dev/ee/bin \
            /usr/local/ps2dev/iop/bin \
            /usr/local/ps2dev/dvp/bin \
            /usr/local/ps2dev/ps2sdk/bin
          do
            echo "$directory" >> "$GITHUB_PATH"
          done

      - name: Verify PS2 toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Checking build tools ==="

          for tool in \
            bash make git gcc sha256sum
          do
            command -v "$tool"
          done

          echo "=== Checking PS2 compiler ==="
          command -v ee-gcc

          echo "=== Checking PS2SDK ==="

          test -f "$PS2SDK/samples/Makefile.pref"
          test -f "$PS2SDK/samples/Makefile.eeglobal"
          test -x "$PS2SDK/bin/bin2c"

          echo "Toolchain verification passed."

      - name: Locate required storage drivers
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Looking for pinned drivers ==="

          DRIVER_DIR=""

          for candidate in \
            "$GITHUB_WORKSPACE/ci/pinned-drivers" \
            "$GITHUB_WORKSPACE/pinned-drivers" \
            "$GITHUB_WORKSPACE/../psxcore-checks/popstarter-usb-reference-20261011/popsloader-drivers"
          do
            echo "Checking: $candidate"

            if [[ -d "$candidate" ]]; then
              DRIVER_DIR="$candidate"
              break
            fi
          done

          if [[ -z "$DRIVER_DIR" ]]; then
            echo "::error::No pinned driver directory found."
            exit 1
          fi

          echo "=== Checking four required drivers ==="

          missing=0

          for file in \
            usbd.irx.usbexfat \
            usbhdfsd.irx.usbexfat \
            usbd.irx.ata \
            usbhdfsd.irx.ata
          do
            if [[ -s "$DRIVER_DIR/$file" ]]; then
              echo "FOUND: $file"
            else
              echo "::error::MISSING: $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "NP_BDMA_MODULE_DIR=$DRIVER_DIR" \
            >> "$GITHUB_ENV"

      - name: Verify driver SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verifying storage drivers ==="

          printf '%s  %s\n' \
            5ea4818ba1cf5207f6d7cadb4c13b5afa88c37c260750c21155b079a8c18f369 \
            "$NP_BDMA_MODULE_DIR/usbd.irx.usbexfat" \
            | sha256sum -c -

          printf '%s  %s\n' \
            70a369e47745e7f995fa771edbbfed086727b759fba915a7070c0fbcf061dd34 \
            "$NP_BDMA_MODULE_DIR/usbhdfsd.irx.usbexfat" \
            | sha256sum -c -

          printf '%s  %s\n' \
            4e1d39365854747117a08f8a8d843937614590ea072cf2b70f6e4c2ebbf3c6ee \
            "$NP_BDMA_MODULE_DIR/usbd.irx.ata" \
            | sha256sum -c -

          printf '%s  %s\n' \
            1cc865cd09997bd708e9e102c0f0f1f17f352b7844b282fcfa6a00f38609db9c \
            "$NP_BDMA_MODULE_DIR/usbhdfsd.irx.ata" \
            | sha256sum -c -

          echo "All driver checksums passed."

      - name: Prepare PS2SDK source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="/src/libs/ps2sdk"

          if [[ ! -f "$SOURCE/iop/system/iomanx/src/iomanX.c" ]]; then
            echo "PS2SDK source missing from image."
            echo "Cloning source repository..."

            SOURCE="$RUNNER_TEMP/ps2sdk-source"

            git clone --depth 1 \
              https://github.com/ps2dev/ps2sdk.git \
              "$SOURCE"

            echo "::warning::Using latest PS2SDK source; revision compatibility is not verified."
          fi

          test -f \
            "$SOURCE/iop/system/iomanx/src/iomanX.c"

          echo "NP_PS2SDK_SOURCE=$SOURCE" \
            >> "$GITHUB_ENV"

      - name: Build PSXCore Runtime
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building runtime ==="

          make --trace runtime \
            NP_BDMA_MODULE_DIR="$NP_BDMA_MODULE_DIR" \
            NP_PS2SDK_SOURCE="$NP_PS2SDK_SOURCE" \
            2>&1 | tee runtime-build.log

          test -s build/runtime/psxcore.elf

          echo "Runtime build succeeded."

      - name: Build PSXCore Tester
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building tester ==="

          make --trace tester \
            2>&1 | tee tester-build.log

          test -s build/psxcore-tester.elf

          echo "Tester build succeeded."

      - name: Prepare full package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/POPS

          cp build/psxcore-tester.elf \
            package/PSXCORE-TESTER.ELF

          cp build/runtime/psxcore.elf \
            package/POPS/psxcore-runtime-bootstrap.elf

          cat > package/README.txt <<'EOF'
          PSXCore Tester - Full Package

          Files included:
          - PSXCORE-TESTER.ELF
          - POPS/psxcore-runtime-bootstrap.elf

          Additional files required:
          - POPS.ELF
          - IOPRP252.IMG
          - Supported VCD game images

          Example USB layout:

          USB:/
            PSXCORE-TESTER.ELF
            POPS/
              psxcore-runtime-bootstrap.elf
              POPS.ELF
              IOPRP252.IMG
              YourGame.VCD

          This is experimental PS2 software.
          Hardware compatibility is not guaranteed.
          EOF

          printf 'PSXCore Full Package\n' \
            > package/BUILD.txt

          printf 'Commit: %s\n' "$GITHUB_SHA" \
            >> package/BUILD.txt

          printf 'Branch: %s\n' "$GITHUB_REF_NAME" \
            >> package/BUILD.txt

          cd package

          sha256sum \
            PSXCORE-TESTER.ELF \
            POPS/psxcore-runtime-bootstrap.elf \
            > SHA256SUMS.txt

          echo "=== Package files ==="
          find . -type f -print

      - name: Upload PSXCore Full Package
        uses: actions/upload-artifact@v4
        with:
          name: PSXCore-Tester-Full
          path: package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PSXCore-Build-Diagnostics
          path: |
            runtime-build.log
            tester-build.log
          if-no-files-found: ignore
          retention-days: 14
