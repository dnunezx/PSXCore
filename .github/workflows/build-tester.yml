
name: Build PSXCore Full Package

on:
  workflow_dispatch:
  push:
    branches:
      - tester

jobs:
  build:
    name: Build Tester and Runtime
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    defaults:
      run:
        shell: sh

    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk

    steps:
      - name: Checkout PSXCore
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            build-base bash git cmake binutils \
            coreutils findutils grep sed patch \
            python3 zlib-dev

      - name: Configure PS2 environment
        run: |
          for directory in \
            "$PS2DEV/bin" \
            "$PS2DEV/ee/bin" \
            "$PS2DEV/iop/bin" \
            "$PS2DEV/dvp/bin" \
            "$PS2SDK/bin"
          do
            echo "$directory" >> "$GITHUB_PATH"
          done

      - name: Verify PS2 toolchain
        run: |
          set -eu

          export PATH="$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin"

          echo "=== Build tools ==="
          command -v make
          command -v git
          command -v sha256sum

          echo "=== PS2 EE compiler ==="
          command -v mips64r5900el-ps2-elf-gcc
          mips64r5900el-ps2-elf-gcc --version

          echo "=== PS2 EE archiver ==="
          command -v mips64r5900el-ps2-elf-ar

          echo "=== PS2 IOP compiler ==="
          command -v mipsel-ps2-irx-gcc

          echo "=== PS2SDK ==="
          test -f "$PS2SDK/samples/Makefile.pref"
          test -f "$PS2SDK/samples/Makefile.eeglobal"
          test -x "$PS2SDK/bin/bin2c"

          echo "Toolchain verification passed."

      - name: Locate pinned drivers
        run: |
          set -eu

          DRIVER_DIR="$GITHUB_WORKSPACE/ci/pinned-drivers"

          if [ ! -d "$DRIVER_DIR" ]; then
            echo "::error::Missing ci/pinned-drivers directory"
            exit 1
          fi

          missing=0

          for file in \
            usbd.irx.usbexfat \
            usbhdfsd.irx.usbexfat \
            usbd.irx.ata \
            usbhdfsd.irx.ata
          do
            if [ -s "$DRIVER_DIR/$file" ]; then
              echo "FOUND: $file"
            else
              echo "::error::MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "NP_BDMA_MODULE_DIR=$DRIVER_DIR" >> "$GITHUB_ENV"

      - name: Prepare PS2SDK source
        run: |
          set -eu

          SOURCE="/src/libs/ps2sdk"

          if [ ! -f "$SOURCE/iop/system/iomanx/src/iomanX.c" ]; then
            SOURCE="$RUNNER_TEMP/ps2sdk-source"

            git clone --depth 1 \
              https://github.com/ps2dev/ps2sdk.git \
              "$SOURCE"

            echo "::warning::Using current PS2SDK source; compatibility is not guaranteed."
          fi

          test -f "$SOURCE/iop/system/iomanx/src/iomanX.c"

          echo "NP_PS2SDK_SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Build PSXCore Tester
        shell: bash
        run: |
          set -euo pipefail

          make --trace tester \
            2>&1 | tee tester-build.log

          test -s build/psxcore-tester.elf

      - name: Build PSXCore Runtime
        shell: bash
        run: |
          set -euo pipefail

          make --trace runtime \
            NP_BDMA_MODULE_DIR="$NP_BDMA_MODULE_DIR" \
            NP_PS2SDK_SOURCE="$NP_PS2SDK_SOURCE" \
            2>&1 | tee runtime-build.log

          test -s build/runtime/psxcore.elf

      - name: Verify pinned driver checksums
        run: |
          set -eu

          echo "Driver hashes were checked by the runtime Makefile."

          for file in \
            usbd.irx.usbexfat \
            usbhdfsd.irx.usbexfat \
            usbd.irx.ata \
            usbhdfsd.irx.ata
          do
            sha256sum "$NP_BDMA_MODULE_DIR/$file"
          done

      - name: Prepare full package
        run: |
          set -eu

          mkdir -p package/POPS

          cp build/psxcore-tester.elf \
            package/PSXCORE-TESTER.ELF

          cp build/runtime/psxcore.elf \
            package/POPS/psxcore-runtime-bootstrap.elf

          cat > package/README.txt <<'EOF'
          PSXCore Tester Full Package

          Included:
          PSXCORE-TESTER.ELF
          POPS/psxcore-runtime-bootstrap.elf

          Additional user-supplied files:
          POPS/POPS.ELF
          POPS/IOPRP252.IMG
          POPS/*.VCD

          Experimental homebrew software.
          Hardware compatibility is not guaranteed.
          EOF

          printf "Commit: %s\n" "$GITHUB_SHA" \
            > package/BUILD.txt

          cd package

          sha256sum \
            PSXCORE-TESTER.ELF \
            POPS/psxcore-runtime-bootstrap.elf \
            > SHA256SUMS.txt

          find . -type f -print

      - name: Upload PSXCore Full Package
        uses: actions/upload-artifact@v4
        with:
          name: PSXCore-Tester-Full
          path: package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PSXCore-Build-Diagnostics
          path: |
            tester-build.log
            runtime-build.log
          if-no-files-found: ignore
          retention-days: 14
