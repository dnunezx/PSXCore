
name: Build PSXCore Full Package

on:
  workflow_dispatch:
  push:
    branches:
      - tester

jobs:
  build:
    name: Build Tester and Runtime
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ps2dev/ps2dev:latest

    defaults:
      run:
        shell: sh

    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2dev/ps2sdk

    steps:
      - name: Checkout PSXCore
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            build-base bash git cmake binutils \
            coreutils findutils grep sed patch \
            python3 zlib-dev

      - name: Configure environment
        run: |
          for dir in \
            "$PS2DEV/bin" \
            "$PS2DEV/ee/bin" \
            "$PS2DEV/iop/bin" \
            "$PS2DEV/dvp/bin" \
            "$PS2SDK/bin"
          do
            echo "$dir" >> "$GITHUB_PATH"
          done

      - name: Inspect PS2 compilers
        run: |
          echo "=== EE compiler ==="
          command -v mips64r5900el-ps2-elf-gcc
          mips64r5900el-ps2-elf-gcc --version

          echo "=== EE archiver ==="
          command -v mips64r5900el-ps2-elf-ar

          echo "=== IOP compiler ==="
          command -v mipsel-none-elf-gcc
          mipsel-none-elf-gcc --version

          echo "=== Available IOP tools ==="
          ls -lah "$PS2DEV/iop/bin"

          echo "=== PS2SDK ==="
          test -f "$PS2SDK/samples/Makefile.pref"
          test -f "$PS2SDK/samples/Makefile.eeglobal"
          test -x "$PS2SDK/bin/bin2c"

      - name: Check required drivers
        run: |
          set -eu

          DRIVER_DIR="$GITHUB_WORKSPACE/ci/pinned-drivers"
          echo "Checking $DRIVER_DIR"

          missing=0

          for file in \
            usbd.irx.usbexfat \
            usbhdfsd.irx.usbexfat \
            usbd.irx.ata \
            usbhdfsd.irx.ata
          do
            if [ -s "$DRIVER_DIR/$file" ]; then
              echo "FOUND: $file"
              sha256sum "$DRIVER_DIR/$file"
            else
              echo "::error::MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "NP_BDMA_MODULE_DIR=$DRIVER_DIR" >> "$GITHUB_ENV"

      - name: Prepare PS2SDK source
        run: |
          set -eu

          SOURCE="/src/libs/ps2sdk"

          if [ ! -f "$SOURCE/iop/system/iomanx/src/iomanX.c" ]; then
            SOURCE="$RUNNER_TEMP/ps2sdk-source"
            git clone --depth 1 \
              https://github.com/ps2dev/ps2sdk.git \
              "$SOURCE"
            echo "::warning::Using unpinned PS2SDK source."
          fi

          test -f "$SOURCE/iop/system/iomanx/src/iomanX.c"

          echo "NP_PS2SDK_SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Build PSXCore Tester
        shell: bash
        run: |
          set -euo pipefail

          make --trace tester \
            2>&1 | tee tester-build.log

          test -s build/psxcore-tester.elf

      - name: Build PSXCore Runtime
        shell: bash
        run: |
          set -euo pipefail

          make --trace runtime \
            NP_BDMA_MODULE_DIR="$NP_BDMA_MODULE_DIR" \
            NP_PS2SDK_SOURCE="$NP_PS2SDK_SOURCE" \
            2>&1 | tee runtime-build.log

          test -s build/runtime/psxcore.elf

      - name: Package full build
        run: |
          set -eu

          mkdir -p package/POPS

          cp build/psxcore-tester.elf \
            package/PSXCORE-TESTER.ELF

          cp build/runtime/psxcore.elf \
            package/POPS/psxcore-runtime-bootstrap.elf

          printf 'PSXCore Tester Full Package\n' \
            > package/README.txt

          printf 'Commit: %s\n' "$GITHUB_SHA" \
            > package/BUILD.txt

          cd package

          sha256sum \
            PSXCORE-TESTER.ELF \
            POPS/psxcore-runtime-bootstrap.elf \
            > SHA256SUMS.txt

          find . -type f -print

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: PSXCore-Tester-Full
          path: package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PSXCore-Build-Diagnostics
          path: |
            tester-build.log
            runtime-build.log
          if-no-files-found: ignore
          retention-days: 14
